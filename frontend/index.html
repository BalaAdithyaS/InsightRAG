<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: rgba(30, 30, 46, 0.9);
            border-right: 1px solid #444;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #444;
        }

        .logo h1 {
            font-size: 24px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .logo p {
            font-size: 12px;
            color: #888;
        }

        /* Upload Section */
        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #444;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(102, 126, 234, 0.1);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: rgba(102, 126, 234, 0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .upload-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .upload-button:hover {
            transform: translateY(-2px);
        }

        #fileInput {
            display: none;
        }

        /* Document Info */
        .document-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #444;
        }

        .document-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .doc-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }

        .clear-docs-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s ease;
        }

        .clear-docs-btn:hover {
            background: #c82333;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(30, 30, 46, 0.9);
            padding: 20px;
            border-bottom: 1px solid #444;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Message Styles */
        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bot-thinking {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #667eea;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
            padding: 10px 0;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: thinking 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes thinking {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Sources Section */
        .sources-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        .sources-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .source-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #333;
        }

        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .source-file {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
        }

        .source-score {
            font-size: 10px;
            color: #888;
        }

        .source-text {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        /* Chat Input */
        .chat-input-container {
            background: rgba(30, 30, 46, 0.9);
            padding: 20px;
            border-top: 1px solid #444;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            border-radius: 25px;
            padding: 12px 20px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-input::placeholder {
            color: #888;
        }

        .send-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status Messages */
        .status-message {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            text-align: center;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            
            .message {
                max-width: 90%;
            }
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #444;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h1>RAG AI Chatbot</h1>
                <p>Ask questions about your documents</p>
            </div>

            <!-- Upload Section -->
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Drop PDF files here or click to browse</div>
                    <button class="upload-button">Choose File</button>
                    <input type="file" id="fileInput" accept=".pdf" multiple>
                </div>
            </div>

            <!-- Document Info -->
            <div class="document-info">
                <h3>Document Status</h3>
                <div class="doc-stats">
                    <span>Chunks loaded:</span>
                    <span id="chunkCount">0</span>
                </div>
                <button class="clear-docs-btn" id="clearDocsBtn">Clear Documents</button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <h2>Chat Interface</h2>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    👋 Hello! I'm your AI assistant. Upload a PDF document and ask me any questions about it.
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="Ask a question about your documents..."
                        disabled
                    >
                    <button class="send-button" id="sendButton" disabled>
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:8000';
        
        // State management
        let documentCount = 0;
        let isProcessing = false;

        // DOM elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const clearDocsBtn = document.getElementById('clearDocsBtn');
        const chunkCount = document.getElementById('chunkCount');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            checkDocumentsStatus();
        });

        // Event listeners
        function setupEventListeners() {
            // Upload events
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            fileInput.addEventListener('change', handleFileSelect);

            // Chat events
            chatInput.addEventListener('keypress', handleKeyPress);
            sendButton.addEventListener('click', sendMessage);
            clearDocsBtn.addEventListener('click', clearDocuments);
        }

        // File handling
        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf');
            if (files.length > 0) {
                uploadFiles(files);
            } else {
                showStatus('Please drop PDF files only', 'error');
            }
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            uploadFiles(files);
        }

        async function uploadFiles(files) {
            for (const file of files) {
                await uploadFile(file);
            }
            fileInput.value = '';
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            showStatus(`Uploading ${file.name}...`, 'info');

            try {
                const response = await fetch(`${API_BASE_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    showStatus(`✅ ${result.message}`, 'success');
                    documentCount += result.chunks_processed;
                    updateDocumentCount();
                    enableChat();
                } else {
                    const error = await response.json();
                    showStatus(`❌ ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Upload failed: ${error.message}`, 'error');
            }
        }

        // Chat functionality
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const query = chatInput.value.trim();
            if (!query || isProcessing) return;

            isProcessing = true;
            sendButton.disabled = true;
            chatInput.disabled = true;

            // Add user message
            addMessage(query, 'user');
            chatInput.value = '';

            // Add thinking indicator
            const thinkingId = addMessage('Thinking...', 'bot', true);

            try {
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });

                if (response.ok) {
                    const result = await response.json();
                    
                    // Remove thinking indicator
                    removeMessage(thinkingId);
                    
                    // Add bot response with sources
                    addMessageWithSources(result.answer, result.sources, query);
                } else {
                    const error = await response.json();
                    removeMessage(thinkingId);
                    addMessage(`❌ Error: ${error.detail}`, 'bot');
                }
            } catch (error) {
                removeMessage(thinkingId);
                addMessage(`❌ Failed to get response: ${error.message}`, 'bot');
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                chatInput.disabled = false;
                chatInput.focus();
            }
        }

        // Message handling
        function addMessage(text, type, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message${isThinking ? ' bot-thinking' : ''}`;
            
            if (isThinking) {
                messageDiv.innerHTML = `
                    <div class="thinking-dots">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                `;
                messageDiv.id = `thinking-${Date.now()}`;
            } else {
                messageDiv.textContent = text;
            }

            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv.id;
        }

        function addMessageWithSources(answer, sources, query) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            
            let sourcesHtml = '';
            if (sources && sources.length > 0) {
                sourcesHtml = `
                    <div class="sources-section">
                        <div class="sources-title">📚 Sources (${sources.length})</div>
                        ${sources.map(source => `
                            <div class="source-item">
                                <div class="source-header">
                                    <span class="source-file">${source.source}</span>
                                    <span class="source-score">Score: ${(source.similarity_score * 100).toFixed(1)}%</span>
                                </div>
                                <div class="source-text">${source.text}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            messageDiv.innerHTML = `
                <div>${answer}</div>
                ${sourcesHtml}
            `;

            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function removeMessage(messageId) {
            const message = document.getElementById(messageId);
            if (message) {
                message.remove();
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Status messages
        function showStatus(message, type = 'info') {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status-message ${type}-message`;
            statusDiv.textContent = message;

            const firstMessage = chatMessages.firstChild;
            chatMessages.insertBefore(statusDiv, firstMessage);

            setTimeout(() => {
                statusDiv.remove();
            }, 5000);
        }

        // Document management
        async function checkDocumentsStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/documents/count`);
                if (response.ok) {
                    const result = await response.json();
                    documentCount = result.document_chunks;
                    updateDocumentCount();
                    if (documentCount > 0) {
                        enableChat();
                    }
                }
            } catch (error) {
                console.error('Failed to check document status:', error);
            }
        }

        async function clearDocuments() {
            if (!confirm('Are you sure you want to clear all documents?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/documents`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    documentCount = 0;
                    updateDocumentCount();
                    disableChat();
                    clearChatMessages();
                    showStatus('✅ All documents cleared', 'success');
                } else {
                    const error = await response.json();
                    showStatus(`❌ Failed to clear documents: ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Failed to clear documents: ${error.message}`, 'error');
            }
        }

        function updateDocumentCount() {
            chunkCount.textContent = documentCount;
        }

        function enableChat() {
            chatInput.disabled = false;
            sendButton.disabled = false;
            chatInput.placeholder = "Ask a question about your documents...";
        }

        function disableChat() {
            chatInput.disabled = true;
            sendButton.disabled = true;
            chatInput.placeholder = "Please upload documents first...";
        }

        function clearChatMessages() {
            chatMessages.innerHTML = `
                <div class="message bot-message">
                    👋 Hello! I'm your AI assistant. Upload a PDF document and ask me any questions about it.
                </div>
            `;
        }

        // API health check
        async function checkAPIHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        // Periodic health check
        setInterval(async () => {
            const isHealthy = await checkAPIHealth();
            if (!isHealthy) {
                showStatus('⚠️ Backend connection lost. Please check if the server is running.', 'error');
            }
        }, 30000); // Check every 30 seconds
    </script>
</body>
</html>
